{% if active_filters %}
<div class="active-filters mb-3 border-filter">
    <div class="">
        {% for f in active_filters %}
        <div class="filter-row">
            <span>{{ f.label }} </span>
            {% for val, link in f.pairs %}
            <span class="filter-badge border-filter"> {{ val }}<a href="{{ link }}">×</a></span>
            {% endfor %}
        </div>
        {% endfor %}
    </div>
    <div class="text-end">
        <a class="btn btn-outline-warning text-dark fw-bold no-underline border-filter"
           href="{{ request.path }}">Išvalyti filtrus</a>
    </div>
</div>
{% endif %}
