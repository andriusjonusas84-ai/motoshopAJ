<div class="text-center">
    {% if user.is_authenticated %}
        <form method="post" action="{% url 'add_to_cart' product.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-success mt-3 px-5 py-2"><i class="bi bi-cart2"></i> Į krepšelį</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}" class="btn btn-success mt-3 px-5 py-2 no-underline"><i class="bi bi-cart2"></i> Į krepšelį</a>
    {% endif %}
</div>
